[SETTINGS]
# nome do arquivo csv
input_file = example.csv

# pasta de saida
output_path = ./example

# nome da coluna mestre
index_column = PGCname

# features (colunas) a serem analisadas
features = C1, C2, sigma_psi

# não alterar
random_seed = 21

[PCA]
# não alterar
n_bootstrap = 10000
# não alterar
n_jobs = -1

[UMAP]
# alterar para True e parametros apenas se quiser fazer UMAP
run_umap = False
grid_search = False
n_neighbors_list = 5, 15, 30, 50, 100
min_dist_list = 0.1, 0.3, 0.5, 0.99
n_neighbors = 5
min_dist = 0.99
